version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/DenisKorkmaz/nostra/gen
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen
    opt: paths=source_relative
  - local: ["node", "web/node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es"]
    out: web/src/gen
    opt: target=ts
