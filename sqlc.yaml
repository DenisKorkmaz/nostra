version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries/system"
    gen:
      go:
        out: "internal/system/internal/store"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_pointers_for_null_types: true
        omit_unused_structs: true
